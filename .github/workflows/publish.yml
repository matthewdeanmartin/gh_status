# .github/workflows/publish-llm-feeds.yml
name: Publish LLM Feeds

on:
  # Run automatically every day at 5:00 PM America/New_York.
  # GitHub Actions schedules are UTC, so we trigger at both possible UTC hours
  # and let the CLI's local-time guard skip the off-hour run.
  schedule:
    - cron: '0 21,22 * * *'

  # Allow running this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build and Deploy Feeds
    runs-on: ubuntu-latest
    # Set permissions for the GITHUB_TOKEN to allow deployment to GitHub Pages
    permissions:
      contents: read     # To checkout the repository
      pages: write        # To deploy to Pages
      id-token: write     # To verify the deployment is coming from the correct source
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name:  checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false



      - name: Set up Python 3.x
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install .

      - name: Run feed generator (scheduled)
        # This step runs for the daily cron schedule.
        # The Python script's internal time guard will ensure it only
        # generates content at the correct local hour.
        if: github.event_name == 'schedule'
        run: gh-status
        env:
          # The script uses the repository owner as the username.
          GITHUB_USERNAME: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TZ_NAME: "America/New_York"

      - name: Run feed generator (manual)
        # This step runs for manual `workflow_dispatch` events.
        # It passes --force to bypass the script's internal time guard.
        if: github.event_name == 'workflow_dispatch'
        run: gh-status --force
        env:
          GITHUB_USERNAME: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TZ_NAME: "America/New_York"

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build web assets
        run: npm run build:web

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          # Upload the 'docs' directory
          path: './docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
